<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus TaxOps – Login</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-dot"></div>
          <div>
            <div class="login-title">Nexus TaxOps</div>
            <div class="login-sub">Sign in to your account</div>
          </div>
        </div>
        <div id="error" class="login-error" style="display:none"></div>
        <label class="login-label">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        <label class="login-label">Password</label>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="loginBtn" class="login-btn">Sign In</button>
        <div class="login-footer">
          <span class="login-muted">Nexus TaxOps Admin Suite</span>
        </div>
      </div>
    </div>
    <script src="/login.js"></script>
  </body>
</html>
